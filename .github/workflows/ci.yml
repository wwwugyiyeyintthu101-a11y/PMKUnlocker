name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # bundled-tools/ and tools/ are intentionally untracked (1.3 GB). CI still runs the byte-level
  # suite; only the checks that read those on-disk assets are SKIPped, and they stay mandatory
  # everywhere the assets are present.
  PMK_CI_ALLOW_MISSING_BUNDLED_TOOLS: "1"

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore tests/Regression/Regression.csproj
          dotnet restore tests/LicenseLogin/LicenseLogin.csproj
          dotnet restore PMKLicenseServer/PMKLicenseServer.csproj
          dotnet restore PMKLicenseAdmin/PMKLicenseAdmin.csproj
          dotnet restore PMKUnlocker/PMKUnlocker.csproj

      - name: Build license server
        run: dotnet build PMKLicenseServer/PMKLicenseServer.csproj -c Debug --no-restore

      - name: Build license admin
        run: dotnet build PMKLicenseAdmin/PMKLicenseAdmin.csproj -c Debug --no-restore

      # Full Build target. The runtime integrity manifest needs the untracked tool inventory, so CI
      # opts out explicitly; release/publish builds still verify every bundled hash and fail closed.
      - name: Build desktop app
        run: dotnet build PMKUnlocker/PMKUnlocker.csproj -c Debug --no-restore -p:SkipToolIntegrity=true

      - name: Verify desktop output
        shell: pwsh
        run: |
          $exe = 'PMKUnlocker/bin/Debug/net8.0-windows/PMKUnlocker.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Desktop build produced no $exe" }
          if (-not (Test-Path -LiteralPath 'PMKUnlocker/bin/Debug/net8.0-windows/libusb-1.0.dll')) {
            throw 'Desktop build did not copy libusb-1.0.dll'
          }
          if (-not (Test-Path -LiteralPath 'PMKUnlocker/bin/Debug/net8.0-windows/Potato.Fastboot.dll')) {
            throw 'Desktop build did not copy the potato managed libraries'
          }

      # The opt-out must stay opt-in: without it (and without the inventory) the Build target has to fail
      # closed, and it must never leave a manifest behind.
      - name: Integrity guard fails closed without the tool inventory
        shell: pwsh
        run: |
          $tmp = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $outFile = Join-Path $tmp 'pmk-default-build.out'
          $errFile = Join-Path $tmp 'pmk-default-build.err'
          # Start-Process keeps the expected non-zero exit out of the step's own $LASTEXITCODE, which the
          # pwsh wrapper would otherwise adopt as the step result.
          $p = Start-Process -FilePath 'dotnet' `
            -ArgumentList 'build','PMKUnlocker/PMKUnlocker.csproj','-c','Debug','--no-restore' `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile -NoNewWindow -Wait -PassThru
          $log = (Get-Content -LiteralPath $outFile -Raw -ErrorAction SilentlyContinue) +
                 (Get-Content -LiteralPath $errFile -Raw -ErrorAction SilentlyContinue)
          if ($p.ExitCode -eq 0) { throw 'Default build succeeded without bundled tools: the integrity guard is not fail-closed' }
          if ($log -notmatch 'Missing bundled integrity inventory') { throw "Default build failed for an unexpected reason:`n$log" }
          if (Test-Path -LiteralPath 'PMKUnlocker/bin/Debug/net8.0-windows/integrity.json') { throw 'A failed build still wrote integrity.json' }
          Write-Host 'Default build failed closed on the missing tool inventory, with no manifest written.'
          exit 0

      - name: Regression checks
        run: dotnet run --project tests/Regression/Regression.csproj -c Debug --no-restore

      # Real server process on a throwaway DataFile + the real LicenseClient/LocalLogin code,
      # including DPAPI remember-me. Needs the license server build from the step above.
      - name: Login flow checks
        run: dotnet run --project tests/LicenseLogin/LicenseLogin.csproj -c Debug --no-restore
